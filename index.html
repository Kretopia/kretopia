<!doctype html>
<html lang="en" data-vibe="midnight" class="dark" style="color-scheme: dark; background-color: #0B0B10;">
  <head>
    <meta charset="UTF-8" />
    <meta name="google-site-verification" content="Q9BsvA9vwgxyOg6XZDaZ-g9T-WyRjbSbIvBuGBZ8VLY" />
    <meta name="google-site-verification" content="xb0QM2nJG4Yx2mopQywL9_ZjtHw1SPvZpG6vhF2sA84" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Satoshi is the one brand typeface (see --font-family-brand in
         src/index.css); Inter below is a technical fallback only, loaded
         so the stack degrades gracefully if Fontshare is unreachable, not
         used as an intentional second family anywhere. Instrument Serif
         was previously loaded here too but is unused — .font-serif in
         index.css force-overrides it to Satoshi everywhere it's applied,
         so the webfont itself was pure dead weight on every page load. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&display=swap" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0B10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kretopia" />
    <title>Kretopia — Where Creativity Lives. The Creative Economy OS.</title>
    <meta name="description" content="Kretopia is the Creative Economy OS. Build your Creative Passport, find opportunities, meet collaborators, and get paid — with Kreto, your Executive Producer." />
    <meta name="author" content="Kretopia" />
    <meta name="keywords" content="Kretopia, Creative Economy OS, Creative Passport, verified credits, EPK, creator portfolio, creative collaboration, Executive Producer, Kreto, filmmakers, musicians, photographers, models, producers, dancers, designers" />

    <meta property="og:title" content="Kretopia — Where Creativity Lives." />
    <meta property="og:description" content="The Creative Economy OS. Build your Creative Passport, find opportunities, meet collaborators, and get paid." />
    <meta property="og:site_name" content="Kretopia" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://www.kretopia.com/og-image.png" />
    <!-- og:url and canonical are set per-route via react-helmet-async (see src/components/SEO.tsx) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Kretopia",
        "alternateName": "Kretopia by Thrive Collective",
        "parentOrganization": { "@type": "Organization", "name": "Thrive Collective" },
        "url": "https://www.kretopia.com",
        "logo": "https://www.kretopia.com/favicon.png",
        "description": "Kretopia is the Creative Economy OS — a professional home for creators to build a Creative Passport, find opportunities, collaborate, and get paid.",
        "founder": { "@type": "Person", "name": "Ethan Auguste" },
        "sameAs": ["https://twitter.com/kretopia", "https://www.instagram.com/kretopia"]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Kretopia",
        "url": "https://www.kretopia.com",
        "applicationCategory": "BusinessApplication",
        "applicationSubCategory": "SocialNetworkingApplication",
        "operatingSystem": "Web, iOS, Android",
        "description": "The Creative Economy OS for filmmakers, musicians, photographers, dancers, designers and producers. Creative Passport, Scout, Match, Studio, SoundStages, KrePay — guided by Kreto, your Executive Producer.",
        "creator": { "@type": "Person", "name": "Ethan Auguste", "jobTitle": "Founder" },
        "publisher": { "@type": "Organization", "name": "Thrive Collective" },
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD",
          "description": "Free tier available. Creator plans from $29/mo."
        },
        "featureList": [
          "Creative Passport — verified creative identity and credits",
          "Scout — opportunities, jobs, casting calls, brand collabs",
          "Match — find collaborators, teams and mentors",
          "Studio — projects, tasks, files, deliverables",
          "SoundStages — live virtual collaboration rooms",
          "KrePay — contracts, invoices and milestone payments",
          "Kreto — your Executive Producer"
        ]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Kretopia",
        "url": "https://www.kretopia.com",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://www.kretopia.com/search?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@kretopia" />
    <meta name="twitter:title" content="Kretopia — Where Creativity Lives." />
    <meta name="twitter:description" content="The Creative Economy OS. Build your Creative Passport, find opportunities, collaborate, and get paid." />
    <meta name="twitter:image" content="https://www.kretopia.com/og-image.png" />
    <script>
      // V1: Midnight locked platform-wide. Vibe picker disabled until post-launch.
      (function () {
        try {
          var html = document.documentElement;
          html.setAttribute("data-vibe", "midnight");
          html.classList.add("dark");
          html.style.colorScheme = "dark";
          html.style.backgroundColor = "#0B0B10";
          localStorage.setItem("ui_vibe", "midnight");
        } catch (_) {}
      })();
    </script>
  </head>

  <body class="bg-background text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

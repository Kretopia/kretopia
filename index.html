    <script>
      // Boot vibe — honor stored choice before paint to avoid theme flash.
      // Default = midnight (Brand System v1.0 — near-black #05070D canvas).
      (function () {
        try {
          var v = localStorage.getItem("ui_vibe");
          if (v !== "daylight" && v !== "midnight" && v !== "neon") v = "midnight";
          var html = document.documentElement;
          html.setAttribute("data-vibe", v);
          if (v === "daylight") {
            html.classList.remove("dark");
            html.style.colorScheme = "light";
            html.style.backgroundColor = "hsl(40 30% 97%)";
          } else {
            html.classList.add("dark");
            html.style.colorScheme = "dark";
            html.style.backgroundColor = "#05070D";
          }
        } catch (_) {}
      })();
    </script>
